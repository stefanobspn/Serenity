<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skala Rasa Lapar (Hunger Scale) — Serenity</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="nav-header">
        <a class="link-kembali" href="sees10.html">&larr; Kembali ke Kuesioner SEES-10</a>
        <span class="langkah-badge">Langkah 4 dari 5</span>
    </div>

    <div class="stepper-container">
        <ol class="stepper">
            <li class="stepper-item completed">
                <span class="stepper-circle">&check;</span>
                <span class="stepper-text">Identitas</span>
            </li>
            <li class="stepper-item completed">
                <span class="stepper-circle">&check;</span>
                <span class="stepper-text">PSS-5</span>
            </li>
            <li class="stepper-item completed">
                <span class="stepper-circle">&check;</span>
                <span class="stepper-text">SEES-10</span>
            </li>
            <li class="stepper-item active">
                <span class="stepper-circle">4</span>
                <span class="stepper-text">Lapar</span>
            </li>
            <li class="stepper-item">
                <span class="stepper-circle">5</span>
                <span class="stepper-text">EEG</span>
            </li>
        </ol>
    </div>

    <header>
        <h1>Skala Rasa Lapar (Hunger Scale)</h1>
        <p>Pilih angka (1–10) yang paling menggambarkan tingkat rasa lapar atau kenyang Anda saat ini.</p>
    </header>

    <main>
        <div id="pesanValidasi" class="alert-error" hidden></div>

        <form id="formHunger">
            <fieldset id="field-q1">
                <legend>Seberapa lapar Anda saat ini?</legend>
                <div class="radio-group">
                    <label class="radio-card"><input type="radio" name="q1" value="1"> 1 - Sangat lapar dan merasa lemas / pusing</label>
                    <label class="radio-card"><input type="radio" name="q1" value="2"> 2 - Sangat lapar, mudah tersinggung, energi rendah, perut banyak berbunyi</label>
                    <label class="radio-card"><input type="radio" name="q1" value="3"> 3 - Cukup lapar, perut mulai berbunyi</label>
                    <label class="radio-card"><input type="radio" name="q1" value="4"> 4 - Mulai merasa lapar</label>
                    <label class="radio-card"><input type="radio" name="q1" value="5"> 5 - Puas / Netral (tidak lapar maupun kenyang)</label>
                    <label class="radio-card"><input type="radio" name="q1" value="6"> 6 - Sedikit kenyang / cukup nyaman kenyang</label>
                    <label class="radio-card"><input type="radio" name="q1" value="7"> 7 - Sedikit tidak nyaman (mulai kekenyangan)</label>
                    <label class="radio-card"><input type="radio" name="q1" value="8"> 8 - Merasa penuh / kekenyangan</label>
                    <label class="radio-card"><input type="radio" name="q1" value="9"> 9 - Sangat tidak nyaman, perut begah / sakit</label>
                    <label class="radio-card"><input type="radio" name="q1" value="10"> 10 - Terlalu kenyang sampai mual</label>
                </div>
            </fieldset>

            <button type="submit" class="btn-lanjut">Lanjut ke Monitoring EEG &rarr;</button>
        </form>
    </main>

    <script src="../js/storage.js"></script>
    <script src="../js/hunger.js"></script>
</body>

</html>
