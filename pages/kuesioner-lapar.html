<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <title>Kuesioner Rasa Lapar (Hunger Scale)</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <header>
    <h1>Skala Rasa Lapar (Hunger Scale)</h1>
  </header>

  <main>
    <a class="link-kembali" href="kuesioner-makan.html">&larr; Kembali</a>
    <p class="langkah">Langkah 3 dari 5</p>

    <p>
      Pilih angka yang paling sesuai dengan rasa lapar kamu saat ini.
      <strong>Semakin rendah angkanya, semakin lapar.</strong>
    </p>

    <form id="formHunger">
      <fieldset>
        <legend>Seberapa lapar kamu sekarang?</legend>
        <label><input type="radio" name="q1" value="1" required> 1 - Sangat lapar dan merasa lemas/pusing</label>
        <label><input type="radio" name="q1" value="2"> 2 - Sangat lapar, mudah tersinggung, energi rendah, perut banyak berbunyi</label>
        <label><input type="radio" name="q1" value="3"> 3 - Cukup lapar, perut mulai berbunyi</label>
        <label><input type="radio" name="q1" value="4"> 4 - Mulai merasa lapar</label>
        <label><input type="radio" name="q1" value="5"> 5 - Puas, tidak lapar maupun kenyang</label>
        <label><input type="radio" name="q1" value="6"> 6 - Sedikit kenyang / cukup nyaman kenyang</label>
        <label><input type="radio" name="q1" value="7"> 7 - Sedikit tidak nyaman (kekenyangan)</label>
        <label><input type="radio" name="q1" value="8"> 8 - Merasa penuh/kekenyangan</label>
        <label><input type="radio" name="q1" value="9"> 9 - Sangat tidak nyaman, perut sakit</label>
        <label><input type="radio" name="q1" value="10"> 10 - Terlalu kenyang sampai mual</label>
      </fieldset>

      <button type="submit" class="btn-mulai">Lanjut ke Monitor EEG</button>
    </form>
  </main>

  <script src="../js/storage.js"></script>
  <script src="../js/hunger.js"></script>

</body>

</html>
